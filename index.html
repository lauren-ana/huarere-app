<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huarere App</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form>
          <input
            type="search"
            class="search-input"
            placeholder="Search for a city..."
            required
          />
          <input type="submit" class="search-button" value="Search" />
        </form>
      </header>
      <main>
        <div class="daily-forecast">
          <div class="daily-forecast-item">
            <div class="forecast-emoji"><h1>⛅</h1></div>
            <div class="forecast-item">
              <div class="forecast-city"><p>Auckland, NZ</p></div>
              <div class="forecast-temp"><p>23<div class="forecast-degree">°C</div></p></div>
            </div>
          </div>
          <div class="daily-forecast-date">
            <p>
              Mostly Sunny
              <br />
              Humidity: 60% 
              <br />
              Windspeed: 15 km/h
            </p>
          </div>
        </div>
      </main>
      <footer>
        <small>
        This project was coded by
        <a href="https://github.com/lauren-ana" target="_blank">Lauren Hohepa</a
        >, is
        <a href="https://github.com/lauren-ana/huarere-app" target="_blank"
          >open-sourced on Github</a
        >
        and
        <a href="https://www.netlify.com/" target="_blank"
          >hosted on Netlify.</a
        >
        </small>
      </footer>
    </div>
  </body>
</html>
