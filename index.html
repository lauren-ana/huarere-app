<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Huarere App</title>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form id="search-form">
          <input
            type="search"
            class="search-input"
            placeholder="Search for a city..."
            required
            id="search-input"
          />
          <input
            type="submit"
            class="search-button"
            value="Search"
            id="search-button"
          />
        </form>
      </header>
      <main>
        <div class="daily-forecast">
          <div class="daily-forecast-item">
            <div id="forecast-emoji"></div>
            <div class="forecast-item">
              <div class="forecast-city" id="forecast-city">Auckland</div>
              <div class="forecast-temp">
                <div class="forecast-degree" id="forecast-degree">23</div>
                <div class="forecast-unit">°C</div>
              </div>
            </div>
          </div>
          <div class="daily-forecast-date">
            <p>
              <span id="current-date"></span>
              <br />
              <span id="condition-description"></span>
              <br />
              🌢
              <span id="humidity"></span> ༄
              <span id="wind-speed"></span>
            </p>
          </div>
        </div>
        <div class="weekly-forecast" id="weekly-forecast"></div>
      </main>
      <footer>
        <small>
          This project was coded by
          <a href="https://github.com/lauren-ana" target="_blank"
            >Lauren Hohepa</a
          >, is
          <a href="https://github.com/lauren-ana/huarere-app" target="_blank"
            >open-sourced on Github</a
          >
          and
          <a href="https://www.netlify.com/" target="_blank"
            >hosted on Netlify.</a
          >
        </small>
      </footer>
    </div>
    <script src="src/script.js"></script>
  </body>
</html>
